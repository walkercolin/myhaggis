<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Haggis</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      :root {
        --bg-1: #2d1406;
        --bg-2: #4a220d;
        --panel: rgba(54, 26, 12, 0.76);
        --panel-border: rgba(255, 201, 122, 0.18);
        --primary: #f7b267;
        --primary-soft: #e9772d;
        --accent: #f3d7a8;
        --text: #fff5ea;
        --muted: #f7d9b0;
        --shadow: rgba(34, 16, 8, 0.42);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(247, 178, 103, 0.25), transparent 22%),
          linear-gradient(135deg, var(--bg-1), var(--bg-2));
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.12;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.08) 0 12%, transparent 12% 24%, rgba(255,255,255,0.08) 24% 36%, transparent 36% 48%, rgba(255,255,255,0.08) 48% 60%, transparent 60% 72%, rgba(255,255,255,0.08) 72% 84%, transparent 84% 100%),
          linear-gradient(rgba(255,255,255,0.08) 0 12%, transparent 12% 24%, rgba(255,255,255,0.08) 24% 36%, transparent 36% 48%, rgba(255,255,255,0.08) 48% 60%, transparent 60% 72%, rgba(255,255,255,0.08) 72% 84%, transparent 84% 100%);
        background-size: 28px 28px;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        position: relative;
        width: min(820px, 100%);
        padding: clamp(28px, 5vw, 56px);
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 24px 60px var(--shadow);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 86px;
        height: 86px;
        border-radius: 26px;
        margin-bottom: 22px;
        background: linear-gradient(135deg, rgba(247, 178, 103, 0.24), rgba(233, 119, 45, 0.18));
        border: 1px solid rgba(255, 201, 122, 0.28);
        box-shadow: 0 12px 24px rgba(247, 178, 103, 0.14);
      }

      .brand svg { width: 52px; height: 52px; display: block; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: rgba(247, 178, 103, 0.14);
        color: var(--accent);
        border: 1px solid rgba(255, 201, 122, 0.25);
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      p {
        margin: 20px 0 0;
        max-width: 40rem;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
        color: var(--muted);
      }

      .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }

      .button {
        appearance: none;
        border: 0;
        cursor: pointer;
        display: inline-block;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font: inherit;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .button:hover { transform: translateY(-1px); }
      .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

      .button.primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-soft));
        color: #2d1406;
        box-shadow: 0 10px 24px rgba(251, 191, 36, 0.3);
      }

      .button.secondary {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--text);
      }

      .user-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 30px;
      }

      .user { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .user img { width: 42px; height: 42px; border-radius: 50%; }
      .user strong, .user small { display: block; overflow: hidden; text-overflow: ellipsis; }
      .user small { margin-top: 3px; color: var(--muted); }

      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
        margin-top: 30px;
      }

      .game {
        display: block;
        min-height: 150px;
        padding: 22px;
        border-radius: 18px;
        color: var(--text);
        text-decoration: none;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .game:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.09); }
      .game-icon { display: block; margin-bottom: 14px; font-size: 2rem; }
      .game strong { font-size: 1.15rem; }
      .game span:last-child { display: block; margin-top: 8px; color: var(--muted); line-height: 1.5; }

      .status { min-height: 24px; margin-top: 20px; color: var(--accent); }
      .empty { margin-top: 28px; padding: 22px; border: 1px dashed rgba(255,255,255,.2); border-radius: 16px; color: var(--muted); }
      .footer { margin-top: 28px; font-size: 0.9rem; color: rgba(248, 250, 252, 0.72); }
      [hidden] { display: none !important; }

      @media (max-width: 540px) {
        .card { padding: 24px 22px; }
        .actions { flex-direction: column; }
        .button { width: 100%; text-align: center; }
        .user-bar { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <section id="loginView">
        <div class="brand" aria-label="My Haggis creature logo">
          <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="32" cy="32" r="26" fill="#fbbf24" opacity="0.15" />
              <path d="M18 38c0-8 6-14 14-14s14 6 14 14v6H18v-6Z" fill="#fbbf24" />
              <path d="M20 25c0-7 5-12 12-12s12 5 12 12v4H20v-4Z" fill="#f7c76b" />
              <circle cx="26" cy="30" r="2.2" fill="#111827" />
              <circle cx="38" cy="30" r="2.2" fill="#111827" />
              <path d="M28 35c2 2 6 2 8 0" stroke="#111827" stroke-width="2.2" />
              <path d="M22 22l-6-6M42 22l6-6" stroke="#f7c76b" stroke-width="3" />
              <path d="M15 43c4 3.5 8.5 5 17 5s13-1.5 17-5M23 46l-4 8M41 46l4 8" stroke="#111827" stroke-width="3" />
              <path d="M28 16c1-2 4-4 8-4s7 2 8 4" stroke="#111827" stroke-width="2.5" />
            </g>
          </svg>
        </div>
        <h1 id="title">My Haggis</h1>
        <p>Sign in with an approved Google account .</p>
        <div class="actions">
          <button id="signInButton" class="button primary" type="button">Sign in with Google</button>
        </div>
        <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
      </section>

      <section id="portalView" hidden>
        <div class="user-bar">
          <div class="user">
            <img id="userPhoto" alt="" hidden />
            <div><strong id="userName"></strong><small id="userEmail"></small></div>
          </div>
          <button id="signOutButton" class="button secondary" type="button">Sign out</button>
        </div>
        <div class="eyebrow">Games</div>
        <h1>Choose a game</h1>
        <div id="games" class="games"></div>
        <div id="emptyGames" class="empty" hidden>No games have been added yet.</div>
      </section>

      <div class="footer">© 2026 My Haggis</div>
    </main>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
      import {
        browserLocalPersistence,
        getAuth,
        GoogleAuthProvider,
        onAuthStateChanged,
        setPersistence,
        signInWithPopup,
        signOut
      } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
      import {
        collection,
        getDocs,
        getFirestore
      } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

      const firebaseConfig = {
        apiKey: 'AIzaSyBC-jGU64gc-xBnAz3b9Ld8SZRcJCym4QE',
        authDomain: 'myhaggis-games.firebaseapp.com',
        projectId: 'myhaggis-games',
        storageBucket: 'myhaggis-games.firebasestorage.app',
        messagingSenderId: '914472191213',
        appId: '1:914472191213:web:d2002ccca9855e5d9b38e4'
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const provider = new GoogleAuthProvider();

      const loginView = document.querySelector('#loginView');
      const portalView = document.querySelector('#portalView');
      const loginStatus = document.querySelector('#loginStatus');
      const signInButton = document.querySelector('#signInButton');
      const signOutButton = document.querySelector('#signOutButton');

      /**
       * Displays the private portal and safely renders games returned by Firestore.
       */
      function showPortal(user, games) {
        document.querySelector('#userName').textContent = user.displayName || 'Family member';
        document.querySelector('#userEmail').textContent = user.email || '';

        const photo = document.querySelector('#userPhoto');
        if (user.photoURL) {
          photo.src = user.photoURL;
          photo.alt = `${user.displayName || 'Family member'} profile photo`;
          photo.hidden = false;
        }

        const gamesContainer = document.querySelector('#games');
        gamesContainer.replaceChildren();

        games.sort((a, b) => (a.order || 0) - (b.order || 0)).forEach((game) => {
          const link = document.createElement('a');
          link.className = 'game';
          link.href = typeof game.url === 'string' && game.url.startsWith('https://') ? game.url : '#';

          const icon = document.createElement('span');
          icon.className = 'game-icon';
          icon.textContent = game.icon || '🎮';

          const title = document.createElement('strong');
          title.textContent = game.title || 'Untitled game';

          const description = document.createElement('span');
          description.textContent = game.description || '';

          link.append(icon, title, description);
          gamesContainer.append(link);
        });

        document.querySelector('#emptyGames').hidden = games.length !== 0;
        loginView.hidden = true;
        portalView.hidden = false;
      }

      /**
       * Verifies database access and loads private games for the signed-in account.
       */
      async function loadPrivatePortal(user) {
        loginStatus.textContent = 'Checking access…';

        try {
          const snapshot = await getDocs(collection(db, 'games'));
          const games = snapshot.docs.map((document) => ({ id: document.id, ...document.data() }));
          showPortal(user, games);
        } catch (error) {
          console.debug('Portal access was denied', error);
          loginStatus.textContent = 'This Google account is not authorised for the portal.';
          await signOut(auth);
        }
      }

      /**
       * Starts Google authentication when the visitor presses the sign-in button.
       */
      async function handleSignIn() {
        signInButton.disabled = true;
        loginStatus.textContent = 'Opening Google sign-in…';

        try {
          await setPersistence(auth, browserLocalPersistence);
          await signInWithPopup(auth, provider);
        } catch (error) {
          console.debug('Google sign-in did not complete', error);
          loginStatus.textContent = error.code === 'auth/popup-closed-by-user'
            ? 'Sign-in was cancelled.'
            : 'Google sign-in could not be completed. Please try again.';
        } finally {
          signInButton.disabled = false;
        }
      }

      /**
       * Returns the page to its signed-out state and clears the Firebase session.
       */
      async function handleSignOut() {
        await signOut(auth);
      }

      signInButton.addEventListener('click', handleSignIn);
      signOutButton.addEventListener('click', handleSignOut);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          loadPrivatePortal(user);
          return;
        }

        portalView.hidden = true;
        loginView.hidden = false;
      });
    </script>
  </body>
</html>
